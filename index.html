<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loto Calendario - Sito Ufficiale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #238636;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #2ea043;
        }
        .btn-secondary {
            background-color: #6e7781;
        }
        .btn-secondary:hover {
            background-color: #57606a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Loto Calendario</h1>
        <p>Benvenuto nella pagina ufficiale della mia applicazione. Qui puoi trovare tutte le informazioni e scaricare l'APK direttamente sul tuo dispositivo in modo semplice e sicuro.</p>
        
        <div class="btn-container">
            <!-- Sostituisci il cancelletto # con il link diretto al download dell'APK quando lo caricherai -->
            <a href="#" class="btn">Scarica APK</a>
            <!-- Sostituisci con la tua email -->
            <a href="mailto:miktattico.java@gmail.com" class="btn btn-secondary">Contattami</a>
        </div>
    </div>

</body>
</html>
